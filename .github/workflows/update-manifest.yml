name: Update Cards Manifest

# Keeps cards/manifest.json (what the app and the dev server read) in step with the cards. The published site
# makes its own in the Site workflow; this is for as long as Pages publishes the files on the branch.

on:
  push:
    branches: [master]
    paths:
      - 'cards/**/*.md'
      - 'site.json'

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate manifest.json
        run: node tools/build-site.js --manifest-only

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards/manifest.json
          if git diff --staged --quiet; then
            echo "No changes to manifest.json"
          else
            git commit -m "Auto-update cards manifest"
            git push
          fi

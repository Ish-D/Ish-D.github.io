name: Site

# Tests, a real-browser check in Chromium, Firefox and WebKit, and (on master) the deploy.
# The site that is published is what tools/build-site.js makes: the files, a page for each card with its title and
# preview, the list of cards, a feed and a sitemap.

on:
  push:
    branches-ignore: [ci-artifacts]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the tests
        shell: bash
        run: |
          npm test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # what failed, where it can be read without the log
            report=$(sed -n '/failing tests:/,$p' test.log | head -70 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3500)
            echo "::error title=npm test::${report}"
          fi
          exit "$code"

  browsers:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chromium decides whether the site is published; the others are reported and do not hold it back.
    continue-on-error: ${{ !matrix.gate }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            gate: true
          - browser: firefox
            gate: false
          - browser: webkit
            gate: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.49.1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.49.1-${{ matrix.browser }}
      - name: Install the browser
        run: |
          npx playwright install ${{ matrix.browser }}
          npx playwright install-deps ${{ matrix.browser }}
      - name: Install poppler, to look at printed pages
        if: matrix.browser == 'chromium'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Build the site
        run: node tools/build-site.js --out _site
      - name: Check it in ${{ matrix.browser }}
        run: node tools/browser-check.mjs --browser ${{ matrix.browser }} --site _site --out report/${{ matrix.browser }}
      - name: Keep what it saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.browser }}
          path: report
          if-no-files-found: ignore

  # Pictures and printed pages from each browser, put on a branch so they can be looked at without downloading
  report:
    needs: browsers
    if: always() && needs.browsers.result != 'skipped' && github.event_name == 'push' && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: ${{ runner.temp }}/report
          merge-multiple: true
      - name: Put them on ci-artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-artifacts
          git rm -rf --quiet .
          cp -r "$RUNNER_TEMP/report/." .
          echo "${GITHUB_SHA} ${GITHUB_REF_NAME}" > source.txt
          git add -A
          git commit -q -m "What the browsers saw at ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}"
          git push --force origin ci-artifacts

  deploy:
    needs: [test, browsers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site
        run: node tools/build-site.js --out _site
      - name: See how Pages is set up
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" | python3 -c "import json,sys; print(json.load(sys.stdin).get('build_type',''))")
          echo "type=$type" >> "$GITHUB_OUTPUT"
          if [ "$type" != "workflow" ]; then
            echo "::notice title=Not published from here::Pages still publishes the files on the branch, so this build was checked and not used. Settings > Pages > Build and deployment > Source: GitHub Actions."
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.type == 'workflow'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.type == 'workflow'
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.pages.outputs.type == 'workflow'

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paper Canvas</title>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://unpkg.com/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="canvas">
        <div id="canvas-content">
            <!-- Cards will be dynamically inserted here -->
        </div>
    </div>

    <!-- Settings button -->
    <button class="settings-btn" id="settings-btn" title="Settings">
        <span>⚙</span>
    </button>

    <!-- KaTeX JS - load synchronously before module -->
    <script src="https://unpkg.com/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
    <!-- KaTeX auto-render extension -->
    <script src="https://unpkg.com/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

    <script type="module" src="/app.js"></script>
</body>
</html>
